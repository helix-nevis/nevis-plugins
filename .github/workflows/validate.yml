name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate skill
        run: python adapters/claude-code/build.py --check
      - name: Ensure committed distribution is current
        run: git diff --exit-code -- dist/
      - name: Run tests
        run: python -m unittest discover -s tests -v
