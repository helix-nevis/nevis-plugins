skill:
  name: solution-delivery-loop
  description: 用“方案收敛与交付闭环工作法”推进需求、方案或交付讨论。适用于新功能、系统改造、技术方案、方案审计、工作拆解、任务开工和交付复核；先对齐整体，再分点确认，以最小有效产物沉淀结论，默认推进常规工作，仅将关键取舍、矛盾与授权升级给人。
version: 0.1.0
methodology: methodology/solution-delivery-loop.md
instructions: skill-src/instructions.md
output: dist/solution-delivery-loop
required_concepts:
  - 总：先整体对齐
  - 分：再处理关键分歧
  - 总：重新组合形成结论
  - 分：最后落实
  - 默认推进，异常升级
  - 最小有效产物
  - 一套事实源
  - 存在／可用／可承诺
  - 轻量统一语言
  - 核心契约先行
  - 短探针
  - 审查与决策分离
  - 粒度停在主要依赖明确、能够独立验收的层级
  - 工作规划和开工授权
  - 任务关闭条件
  - 批次业务验收
  - 未核验能力不进入确定承诺
